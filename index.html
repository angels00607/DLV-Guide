<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0">
<title>DLV Guide — Disney Dreamlight Valley</title>
<link href="https://fonts.googleapis.com/css2?family=Nunito:wght@400;500;600;700&family=Quicksand:wght@500;600;700&display=swap" rel="stylesheet">
<style>
:root {
  --bg: #f7f3ff;
  --surface: #ffffff;
  --surface2: #f0ebff;
  --border: rgba(140,110,220,0.18);
  --border2: rgba(140,110,220,0.35);
  --accent: #7c5cbf;
  --accent2: #a87de0;
  --accent-light: #ede7ff;
  --text: #2d1f4e;
  --text2: #7a6898;
  --text3: #b0a0cc;
  --danger: #e05c6e;
  --success: #4db88c;
  --shadow: 0 2px 16px rgba(124,92,191,0.10);
  --radius: 14px;
  --radius-sm: 8px;
}
* { box-sizing: border-box; margin: 0; padding: 0; -webkit-tap-highlight-color: transparent; }
html, body { height: 100%; font-family: 'Nunito', sans-serif; background: var(--bg); color: var(--text); }

/* ── LAYOUT ── */
#app { display: flex; height: 100vh; height: 100dvh; overflow: hidden; }

/* ── SIDEBAR ── */
#sidebar {
  width: 220px; min-width: 220px;
  background: var(--surface);
  border-right: 1px solid var(--border);
  display: flex; flex-direction: column;
  overflow: hidden;
  transition: transform 0.28s cubic-bezier(.4,0,.2,1);
  z-index: 200;
}
#sidebar-header {
  padding: 20px 16px 14px;
  border-bottom: 1px solid var(--border);
  background: linear-gradient(135deg, #7c5cbf 0%, #a87de0 100%);
}
#sidebar-header h1 { font-family: 'Quicksand', sans-serif; font-size: 20px; font-weight: 700; color: #fff; letter-spacing: 0.5px; }
#sidebar-header p { font-size: 11px; color: rgba(255,255,255,0.75); margin-top: 2px; letter-spacing: 0.3px; }
#nav-list { flex: 1; overflow-y: auto; padding: 8px 0; }
#nav-list::-webkit-scrollbar { width: 4px; }
#nav-list::-webkit-scrollbar-thumb { background: var(--border2); border-radius: 4px; }
.nav-item {
  display: flex; align-items: center; gap: 10px;
  padding: 10px 16px; cursor: pointer;
  font-size: 13px; color: var(--text2);
  border-left: 3px solid transparent;
  transition: all 0.15s;
  user-select: none;
}
.nav-item:hover { background: var(--surface2); color: var(--text); }
.nav-item.active { background: var(--accent-light); color: var(--accent); border-left-color: var(--accent); font-weight: 700; }
.nav-icon { width: 20px; height: 20px; min-width: 20px; object-fit: contain; flex-shrink: 0; }
.nav-label { flex: 1; }
.nav-count {
  font-size: 11px; color: var(--text3);
  background: var(--surface2); padding: 2px 7px;
  border-radius: 20px; flex-shrink: 0;
}
.nav-item.active .nav-count { background: rgba(124,92,191,0.12); color: var(--accent); }

/* ── MAIN ── */
#main { flex: 1; display: flex; flex-direction: column; overflow: hidden; min-width: 0; }

/* ── TOPBAR ── */
#topbar {
  padding: 0 16px;
  height: 56px;
  border-bottom: 1px solid var(--border);
  display: flex; align-items: center; gap: 12px;
  background: var(--surface);
  flex-shrink: 0;
}
#menu-btn {
  display: none; background: none; border: none;
  cursor: pointer; padding: 6px; border-radius: var(--radius-sm);
  color: var(--text2); font-size: 20px; line-height: 1;
}
#topbar h2 { font-family: 'Quicksand', sans-serif; font-size: 17px; font-weight: 700; color: var(--text); flex: 1; min-width: 0; }
.progress-wrap { display: flex; align-items: center; gap: 8px; flex-shrink: 0; }
.progress-bar { width: 90px; height: 6px; background: var(--surface2); border-radius: 4px; overflow: hidden; }
.progress-fill { height: 100%; background: linear-gradient(90deg, var(--accent), var(--accent2)); border-radius: 4px; transition: width 0.35s; }
.progress-text { font-size: 12px; color: var(--text2); font-weight: 600; white-space: nowrap; }

/* ── SEARCH / FILTERS ── */
#search-bar {
  padding: 10px 16px;
  border-bottom: 1px solid var(--border);
  display: flex; gap: 8px; align-items: center;
  background: var(--surface);
  flex-shrink: 0; flex-wrap: wrap;
}
#search-input {
  flex: 1; min-width: 100px;
  padding: 7px 12px;
  border: 1px solid var(--border2);
  border-radius: var(--radius-sm);
  font-size: 13px; font-family: 'Nunito', sans-serif;
  background: var(--bg); color: var(--text);
  outline: none; transition: border 0.15s;
}
#search-input:focus { border-color: var(--accent); }
#search-input::placeholder { color: var(--text3); }
.filters { display: flex; gap: 6px; flex-shrink: 0; }
.filter-btn {
  padding: 6px 12px; font-size: 12px; font-weight: 600;
  border: 1px solid var(--border2); border-radius: 20px;
  background: var(--surface); color: var(--text2);
  cursor: pointer; transition: all 0.15s; font-family: 'Nunito', sans-serif;
  white-space: nowrap;
}
.filter-btn:hover { background: var(--surface2); }
.filter-btn.active { background: var(--accent); border-color: var(--accent); color: #fff; }

/* ── LIST AREA ── */
#list-area { flex: 1; overflow-y: auto; padding: 12px 16px 80px; }
#list-area::-webkit-scrollbar { width: 5px; }
#list-area::-webkit-scrollbar-thumb { background: var(--border2); border-radius: 4px; }

.list-item {
  display: flex; align-items: center; gap: 10px;
  padding: 9px 12px; border-radius: var(--radius-sm);
  border: 1px solid transparent;
  transition: all 0.12s; margin-bottom: 2px;
}
.list-item:hover { background: var(--surface2); border-color: var(--border); }
.list-item.checked { opacity: 0.45; }

/* ── OWNED TOGGLE (croix = "je n'ai pas") ── */
.item-owned {
  width: 20px; height: 20px; min-width: 20px;
  border: 1.5px solid var(--border2);
  border-radius: 5px; background: var(--surface);
  cursor: pointer; display: flex; align-items: center; justify-content: center;
  font-size: 13px; font-weight: 700; color: var(--text3);
  flex-shrink: 0; transition: all 0.15s; user-select: none;
  line-height: 1;
}
.item-owned:hover { border-color: var(--danger); color: var(--danger); background: #fde8ea; }
.item-owned.missing { border-color: var(--danger); background: #fde8ea; color: var(--danger); }
.item-owned.owned { border-color: var(--success); background: #e6f9f2; color: var(--success); }
.item-label { font-size: 14px; color: var(--text); flex: 1; cursor: pointer; min-width: 0; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.item-meta {
  font-size: 11px; color: var(--accent);
  background: var(--accent-light); padding: 2px 8px;
  border-radius: 20px; flex-shrink: 0; font-weight: 600;
  white-space: nowrap;
}
.item-meta2 {
  font-size: 11px; color: #7a5c00;
  background: #fff3cc; padding: 2px 8px;
  border-radius: 20px; flex-shrink: 0; font-weight: 600;
  white-space: nowrap;
}
.item-delete {
  width: 24px; height: 24px; min-width: 24px;
  border: none; background: none; color: var(--text3);
  cursor: pointer; opacity: 0; font-size: 13px;
  display: flex; align-items: center; justify-content: center;
  border-radius: 6px; transition: all 0.12s; flex-shrink: 0;
}
.list-item:hover .item-delete { opacity: 1; }
.item-delete:hover { background: #fde8ea; color: var(--danger); }

.item-edit {
  width: 24px; height: 24px; min-width: 24px;
  border: none; background: none; color: var(--text3);
  cursor: pointer; opacity: 0; font-size: 13px;
  display: flex; align-items: center; justify-content: center;
  border-radius: 6px; transition: all 0.12s; flex-shrink: 0;
}
.list-item:hover .item-edit { opacity: 1; }
.item-edit:hover { background: var(--accent-light); color: var(--accent); }

/* touch devices: always show delete & edit */
@media (pointer: coarse) {
  .item-delete { opacity: 0.45; }
  .item-edit { opacity: 0.45; }
}

/* ── INLINE EDIT MODE ── */
.list-item.editing { background: var(--accent-light); border-color: var(--accent2); }
.item-edit-fields {
  display: flex; flex: 1; gap: 6px; align-items: center; min-width: 0;
}
.item-edit-name {
  flex: 1; min-width: 0;
  padding: 3px 8px;
  border: 1px solid var(--accent2); border-radius: var(--radius-sm);
  font-size: 14px; font-family: 'Nunito', sans-serif;
  color: var(--text); background: var(--surface);
  outline: none;
}
.item-edit-name:focus { border-color: var(--accent); }
.item-edit-meta {
  width: 90px; min-width: 50px; flex-shrink: 1;
  padding: 3px 8px;
  border: 1px solid var(--border2); border-radius: var(--radius-sm);
  font-size: 12px; font-family: 'Nunito', sans-serif;
  color: var(--accent); background: var(--surface);
  outline: none;
}
.item-edit-meta:focus { border-color: var(--accent); }
.item-edit-meta2 {
  width: 90px; min-width: 50px; flex-shrink: 1;
  padding: 3px 8px;
  border: 1px solid var(--border2); border-radius: var(--radius-sm);
  font-size: 12px; font-family: 'Nunito', sans-serif;
  color: #7a5c00; background: var(--surface);
  outline: none;
}
.item-edit-meta2:focus { border-color: var(--accent); }
.item-edit-confirm {
  width: 24px; height: 24px; min-width: 24px;
  border: none; background: none; color: var(--success);
  cursor: pointer; font-size: 15px;
  display: flex; align-items: center; justify-content: center;
  border-radius: 6px; transition: all 0.12s; flex-shrink: 0;
}
.item-edit-confirm:hover { background: #e6f9f2; }

/* ── ADD ROW ── */
.add-row {
  display: flex; gap: 8px; align-items: center;
  padding: 8px 12px; margin-top: 10px;
  border: 1.5px dashed var(--border2);
  border-radius: var(--radius-sm);
  background: rgba(237,231,255,0.4);
}
.add-row input[type=text] {
  flex: 1; border: none; background: none;
  font-size: 13px; font-family: 'Nunito', sans-serif;
  color: var(--text); outline: none;
  min-width: 0;
}
.add-row input[type=text]::placeholder { color: var(--text3); }
.add-meta-input {
  width: 90px; min-width: 50px; flex-shrink: 1;
  border: none; border-left: 1px solid var(--border); padding-left: 8px;
  background: none; font-size: 12px; font-family: 'Nunito', sans-serif;
  color: var(--text2); outline: none;
}
.add-meta-input::placeholder { color: var(--text3); }
.add-meta2-input {
  width: 90px; min-width: 50px; flex-shrink: 1;
  border: none; border-left: 1px solid var(--border); padding-left: 8px;
  background: none; font-size: 12px; font-family: 'Nunito', sans-serif;
  color: var(--accent2); outline: none;
}
.add-meta2-input::placeholder { color: var(--text3); }
.add-btn {
  padding: 6px 14px; background: var(--accent); color: #fff;
  border: none; border-radius: var(--radius-sm);
  font-size: 12px; font-weight: 700; font-family: 'Nunito', sans-serif;
  cursor: pointer; white-space: nowrap; transition: background 0.15s;
}
.add-btn:hover { background: #6344a8; }
.add-btn:active { transform: scale(0.97); }

/* ── EMPTY STATE ── */
.empty-state { text-align: center; padding: 48px 20px; color: var(--text3); font-size: 14px; }
.empty-state span { display: block; font-size: 32px; margin-bottom: 10px; }

/* ── ACCORDION / INGREDIENTS ── */
.recipe-item { flex-direction: column; align-items: stretch; gap: 0; padding: 0; }
.recipe-main { display: flex; align-items: center; gap: 10px; padding: 9px 12px; width: 100%; }
.accordion-btn {
  background: none; border: 1px solid var(--border2);
  border-radius: 20px; padding: 3px 10px;
  font-size: 11px; font-family: 'Nunito', sans-serif;
  color: var(--text2); cursor: pointer; white-space: nowrap;
  display: flex; align-items: center; gap: 4px;
  transition: all 0.15s; flex-shrink: 0;
}
.accordion-btn:hover { background: var(--accent-light); color: var(--accent); border-color: var(--accent); }
.accordion-btn.open { background: var(--accent-light); color: var(--accent); border-color: var(--accent); }
.accordion-arrow { transition: transform 0.2s; display: inline-block; }
.accordion-btn.open .accordion-arrow { transform: rotate(90deg); }
.ingredient-panel {
  display: none; flex-direction: column; gap: 0;
  padding: 4px 12px 10px 40px;
  border-top: 1px solid var(--border);
}
.ingredient-panel.open { display: flex; }
.ingredient-row {
  display: flex; align-items: center; gap: 6px;
  padding: 3px 0; font-size: 12px; color: var(--text2);
}
.ingredient-bullet { color: var(--accent2); font-size: 10px; flex-shrink: 0; }
.ingredient-text { flex: 1; }
.ingredient-delete {
  background: none; border: none; color: var(--text3); cursor: pointer;
  font-size: 11px; opacity: 0; padding: 2px 4px;
  border-radius: 4px; transition: all 0.12s;
}
.ingredient-row:hover .ingredient-delete { opacity: 1; }
.ingredient-delete:hover { background: #fde8ea; color: var(--danger); }
@media (pointer: coarse) { .ingredient-delete { opacity: 0.45; } }
.ingredient-add-row {
  display: flex; gap: 6px; align-items: center; margin-top: 6px;
}
.ingredient-input {
  flex: 1; padding: 4px 8px;
  border: 1px solid var(--border2); border-radius: var(--radius-sm);
  font-size: 12px; font-family: 'Nunito', sans-serif;
  background: var(--bg); color: var(--text); outline: none;
}
.ingredient-input:focus { border-color: var(--accent); }
.ingredient-add-btn {
  padding: 4px 10px; background: var(--accent); color: #fff;
  border: none; border-radius: var(--radius-sm);
  font-size: 11px; font-weight: 700; font-family: 'Nunito', sans-serif;
  cursor: pointer; white-space: nowrap; transition: background 0.15s;
}
.ingredient-add-btn:hover { background: #6344a8; }

/* ── SIDEBAR FOOTER ── */
#sidebar-footer {
  padding: 10px 12px;
  border-top: 1px solid var(--border);
  display: flex; gap: 6px;
  flex-shrink: 0;
}
.sidebar-btn {
  flex: 1; padding: 7px 4px;
  font-size: 11px; font-weight: 700; font-family: 'Nunito', sans-serif;
  border-radius: var(--radius-sm); border: 1px solid var(--border2);
  cursor: pointer; transition: all 0.15s;
  display: flex; align-items: center; justify-content: center; gap: 4px;
  white-space: nowrap;
}
.sidebar-btn.export { background: var(--accent); color: #fff; border-color: var(--accent); }
.sidebar-btn.export:hover { background: #6344a8; }



/* ── GROUP HEADERS ── */
.group-header {
  padding: 6px 12px 4px;
  font-size: 11px; font-weight: 700; letter-spacing: 0.6px;
  color: var(--text2);
  background: var(--surface2);
  border-radius: var(--radius-sm);
  margin: 10px 0 2px;
  text-transform: uppercase;
  border-left: 3px solid var(--accent2);
}
.group-header:first-child { margin-top: 0; }

/* ── GITHUB SAVE MODAL ── */
#gh-modal-overlay {
  display: none; position: fixed; inset: 0;
  background: rgba(30,15,60,0.55); z-index: 500;
  backdrop-filter: blur(3px);
  align-items: center; justify-content: center;
}
#gh-modal-overlay.active { display: flex; }
#gh-modal {
  background: var(--surface); border-radius: var(--radius);
  padding: 24px; width: 320px; max-width: 90vw;
  box-shadow: 0 8px 40px rgba(60,20,120,0.22);
  display: flex; flex-direction: column; gap: 14px;
}
#gh-modal h3 {
  font-family: 'Quicksand', sans-serif; font-size: 16px;
  font-weight: 700; color: var(--text); margin: 0;
}
#gh-modal p { font-size: 12px; color: var(--text2); margin: 0; line-height: 1.5; }
.gh-field { display: flex; flex-direction: column; gap: 4px; }
.gh-field label { font-size: 11px; font-weight: 700; color: var(--text2); letter-spacing: 0.4px; }
.gh-field input {
  padding: 8px 10px; border: 1px solid var(--border2);
  border-radius: var(--radius-sm); font-size: 13px;
  font-family: 'Nunito', sans-serif; color: var(--text);
  background: var(--bg); outline: none;
}
.gh-field input:focus { border-color: var(--accent); }
.gh-actions { display: flex; gap: 8px; margin-top: 4px; }
.gh-btn {
  flex: 1; padding: 9px; font-size: 13px; font-weight: 700;
  font-family: 'Nunito', sans-serif; border-radius: var(--radius-sm);
  border: none; cursor: pointer; transition: all 0.15s;
}
.gh-btn.primary { background: var(--accent); color: #fff; }
.gh-btn.primary:hover { background: #6344a8; }
.gh-btn.primary:disabled { background: var(--text3); cursor: not-allowed; }
.gh-btn.secondary { background: var(--surface2); color: var(--text2); border: 1px solid var(--border2); }
.gh-btn.secondary:hover { background: var(--border2); }
#gh-status {
  font-size: 12px; text-align: center; min-height: 16px;
  color: var(--text2); font-weight: 600;
}
#gh-status.ok  { color: var(--success); }
#gh-status.err { color: var(--danger); }

.sidebar-btn.save { background: var(--success); color: #fff; border-color: var(--success); }
.sidebar-btn.save:hover { background: #3a9e78; }

/* ── SCROLL TO TOP ── */
#scroll-top {
  position: fixed; bottom: 24px; right: 20px;
  width: 38px; height: 38px;
  background: var(--accent); color: #fff;
  border: none; border-radius: 50%;
  font-size: 18px; line-height: 1;
  cursor: pointer; display: none;
  align-items: center; justify-content: center;
  box-shadow: 0 2px 10px rgba(124,92,191,0.35);
  transition: opacity 0.2s, background 0.15s;
  z-index: 300;
}
#scroll-top:hover { background: #6344a8; }
#scroll-top.visible { display: flex; }

/* ── OVERLAY ── */
#overlay {
  display: none; position: fixed; inset: 0;
  background: rgba(30,15,60,0.45); z-index: 150;
  backdrop-filter: blur(2px);
}
#overlay.active { display: block; }

/* ── MOBILE ── */
@media (max-width: 640px) {
  #menu-btn { display: flex; align-items: center; justify-content: center; }
  #sidebar {
    position: fixed; left: 0; top: 0; bottom: 0;
    width: 260px; min-width: 260px;
    transform: translateX(-100%);
    box-shadow: 4px 0 32px rgba(60,20,120,0.18);
  }
  #sidebar.open { transform: translateX(0); }
  .progress-bar { width: 60px; }
  .add-meta-input { width: 70px; min-width: 40px; font-size: 11px; }
  .add-meta2-input { width: 70px; min-width: 40px; font-size: 11px; }
  .add-row { flex-wrap: wrap; gap: 6px; }
  .add-row input[type=text]:first-of-type { min-width: 120px; }
  .add-btn { width: 100%; margin-top: 2px; padding: 8px 14px; font-size: 13px; }
  .item-label { font-size: 13px; }
  .list-item { padding: 8px 10px; }
  #list-area { padding: 10px 10px 100px; }
  /* accordion mobile */
  .accordion-btn { font-size: 11px; padding: 4px 8px; }
  .ingredient-input { font-size: 12px; }
}
@media (max-width: 400px) {
  #topbar { padding: 0 10px; gap: 8px; }
  #topbar h2 { font-size: 14px; }
  #search-bar { padding: 8px 10px; }
  .filter-btn { padding: 5px 8px; font-size: 11px; }
  .progress-text { font-size: 11px; }
}
</style>
</head>
<body>
<div id="overlay" onclick="closeSidebar()"></div>
<div id="loading-screen" style="position:fixed;inset:0;background:#f7f3ff;display:flex;flex-direction:column;align-items:center;justify-content:center;z-index:9999;font-family:'Nunito',sans-serif;">
  <div style="font-size:32px;margin-bottom:12px">✦</div>
  <div style="font-size:16px;font-weight:700;color:#7c5cbf">DLV Guide</div>
  <div style="font-size:13px;color:#7a6898;margin-top:6px">Chargement...</div>
</div>
<button id="scroll-top" onclick="document.getElementById('list-area').scrollTo({top:0,behavior:'smooth'})" title="Remonter en haut">↑</button>
<div id="app">
  <div id="sidebar">
    <div id="sidebar-header">
      <h1>✦ DLV Guide</h1>
      <p>Disney Dreamlight Valley</p>
    </div>
    <div id="nav-list"></div>
    <div id="sidebar-footer">
      <button class="sidebar-btn save" onclick="openGhModal()" title="Sauvegarder sur GitHub">💾 Sauvegarder</button>
      <button class="sidebar-btn export" onclick="exportData()" title="Exporter les données">⬇ Export</button>
    </div>
  </div>
  <div id="main">
    <div id="topbar">
      <button id="menu-btn" onclick="toggleSidebar()">☰</button>
      <h2 id="page-title">Characters</h2>
      <div class="progress-wrap">
        <div class="progress-bar"><div class="progress-fill" id="progress-fill" style="width:0%"></div></div>
        <span class="progress-text" id="progress-text">0 / 0</span>
      </div>
    </div>
    <div id="search-bar">
      <input type="text" id="search-input" placeholder="Rechercher...">
      <div class="filters">
        <button class="filter-btn active" id="filter-all" onclick="setFilter('all')">Tous</button>
        <button class="filter-btn" id="filter-todo" onclick="setFilter('todo')">À faire</button>
        <button class="filter-btn" id="filter-done" onclick="setFilter('done')">Faits</button>
      </div>
    </div>
    <div id="list-area"></div>
  </div>
</div>

<script>
const STORAGE_KEY = 'dlv_guide_v6';
const CATEGORIES = [
  {id:'characters', label:'Characters', img:'/DLV-Guide/images/Menu_Icon_Characters.png'},
  {id:'clothing', label:'Clothing sets', img:'/DLV-Guide/images/Menu_Icon_Clothing.png'},
  {id:'crafting', label:'Crafting recipes', img:'/DLV-Guide/images/Crafting.png'},
  {id:'companions', label:'Companions', img:'/DLV-Guide/images/Menu_Icon_Companions.png'},
  {id:'fish', label:'Fish', img:'/DLV-Guide/images/Menu_Icon_Fish.png'},
  {id:'foraging', label:'Foraging', img:'/DLV-Guide/images/Foraging.png'},
  {id:'furniture', label:'Furniture sets', img:'/DLV-Guide/images/Menu_Icon_Furniture.png'},
  {id:'gems', label:'Gems', img:'/DLV-Guide/images/Menu_Icon_Gems.png'},
  {id:'ingredients', label:'Ingredients', img:'/DLV-Guide/images/Menu_Icon_Ingredients.png'},
  {id:'meals', label:'Meal recipes', img:'/DLV-Guide/images/Menu_Icon_Meals.png'},
];

// Data loaded from external data.json
let DEFAULT_DATA={},DEFAULT_OWNED={},DEFAULT_CHECKED={},DEFAULT_INGREDIENTS={};


let data = {}, checked = {}, nextId = {}, ingredients = {}, owned = {};
let currentCat = 'characters', currentFilter = 'all';

function exportData() {
  const payload = JSON.stringify({data, checked, nextId, ingredients, owned}, null, 2);
  const blob = new Blob([payload], {type: 'application/json'});
  const url = URL.createObjectURL(blob);
  const a = document.createElement('a');
  a.href = url;
  const date = new Date().toISOString().slice(0,10);
  a.download = 'dlv-guide-sauvegarde-' + date + '.json';
  a.click();
  URL.revokeObjectURL(url);
}


function loadData() {
  try {
    const saved = localStorage.getItem(STORAGE_KEY);
    if (saved) {
      const p = JSON.parse(saved);
      data = p.data||{}; checked = p.checked||{}; nextId = p.nextId||{};
      ingredients = p.ingredients||{}; owned = p.owned||{};
    }
  } catch(e) {}
  CATEGORIES.forEach(c => {
    if (!data[c.id]) data[c.id] = [];
    if (!checked[c.id]) checked[c.id] = {};
    if (!owned[c.id]) owned[c.id] = {};
    if (!ingredients[c.id]) ingredients[c.id] = {};
    // Merge: add any DEFAULT_DATA items not already present (by id)
    const existingIds = new Set(data[c.id].map(i => i.id));
    (DEFAULT_DATA[c.id]||[]).forEach(item => {
      if (!existingIds.has(item.id)) data[c.id].push(Object.assign({}, item));
    });
    // Merge DEFAULT_OWNED: only set if not already defined in saved state
    const defOwned = DEFAULT_OWNED[c.id]||{};
    Object.entries(defOwned).forEach(([id, val]) => {
      if (owned[c.id][id] === undefined) owned[c.id][id] = val;
    });
    // Merge DEFAULT_CHECKED: only set if not already defined
    const defChecked = DEFAULT_CHECKED[c.id]||{};
    Object.entries(defChecked).forEach(([id, val]) => {
      if (checked[c.id][id] === undefined) checked[c.id][id] = val;
    });
    // Merge DEFAULT_INGREDIENTS: only set if not already defined
    const defIng = DEFAULT_INGREDIENTS[c.id]||{};
    Object.entries(defIng).forEach(([itemId, ings]) => {
      if (!ingredients[c.id][itemId]) ingredients[c.id][itemId] = ings;
    });
    // nextId = max id + 1
    nextId[c.id] = data[c.id].length ? Math.max(...data[c.id].map(i=>i.id))+1 : 1;
    sortCat(c.id);
  });
}

function saveData() {
  try { localStorage.setItem(STORAGE_KEY, JSON.stringify({data, checked, nextId, ingredients, owned})); } catch(e) {}
}

// Sort: règles par catégorie
function sortCat(catId) {
  data[catId].sort((a, b) => {
    const na = a.name.toLowerCase(), nb = b.name.toLowerCase();
    const m1a = (a.meta||'').toLowerCase(), m1b = (b.meta||'').toLowerCase();
    const m2a = (a.meta2||'').toLowerCase(), m2b = (b.meta2||'').toLowerCase();

    if (catId === 'fish' || catId === 'gems') {
      // Tri uniquement par nom
      if (na < nb) return -1; if (na > nb) return 1;
      return 0;
    }
    if (catId === 'foraging') {
      // Tri par tag2 puis nom (tag1 ignoré)
      if (m2a < m2b) return -1; if (m2a > m2b) return 1;
      if (na < nb) return -1; if (na > nb) return 1;
      return 0;
    }
    // Défaut : tag1 → tag2 → nom
    if (m1a < m1b) return -1; if (m1a > m1b) return 1;
    if (m2a < m2b) return -1; if (m2a > m2b) return 1;
    if (na < nb) return -1; if (na > nb) return 1;
    return 0;
  });
}

function esc(s) { return String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;'); }

function renderNav() {
  document.getElementById('nav-list').innerHTML = CATEGORIES.map(c => {
    const total = data[c.id]?.length || 0;
    const done = (data[c.id]||[]).filter(item => (owned[c.id]?.[item.id]) === 'owned').length;
    return `<div class="nav-item${c.id===currentCat?' active':''}" onclick="switchCat('${c.id}')">
      <img class="nav-icon" src="${c.img}" alt="${c.label}">
      <span class="nav-label">${c.label}</span>
      <span class="nav-count">${done}/${total}</span>
    </div>`;
  }).join('');
}

function renderList() {
  const cat = currentCat;
  const items = data[cat]||[];
  const q = document.getElementById('search-input').value.toLowerCase();
  const catChecked = checked[cat]||{};
  const catObj = CATEGORIES.find(c=>c.id===cat);
  const isAccordion = ACCORDION_CATS.has(cat);
  document.getElementById('page-title').textContent = catObj?.label||cat;
  const total = items.length;
  const done = items.filter(item => (owned[cat]?.[item.id]) === 'owned').length;
  document.getElementById('progress-fill').style.width = total ? (done/total*100)+'%' : '0%';
  document.getElementById('progress-text').textContent = done + ' / ' + total;

  let filtered = items.filter(item => {
    if (q && !item.name.toLowerCase().includes(q) && !(item.meta||'').toLowerCase().includes(q) && !(item.meta2||'').toLowerCase().includes(q)) return false;
    if (currentFilter==='done' && owned[cat]?.[item.id] !== 'owned') return false;
    if (currentFilter==='todo' && owned[cat]?.[item.id] === 'owned') return false;
    return true;
  });

  const area = document.getElementById('list-area');

  if (!filtered.length) {
    area.innerHTML = `<div class="empty-state"><span>✦</span>Aucun élément trouvé</div>` + addRowHTML(catObj, isAccordion);
    bindAddRow(isAccordion);
    currentVirtualList = null;
    return;
  }

  const groupField = GROUPED_CATS[cat];

  // Build flat row list: {type:'header'|'item', key?, item?}
  let rows = [];
  if (groupField) {
    const groups = {};
    filtered.forEach(item => {
      const key = (item[groupField]||'').trim() || '—';
      if (!groups[key]) groups[key] = [];
      groups[key].push(item);
    });
    Object.keys(groups).sort((a,b)=>a.localeCompare(b)).forEach(key => {
      rows.push({type:'header', key});
      groups[key].forEach(item => rows.push({type:'item', item}));
    });
  } else {
    filtered.forEach(item => rows.push({type:'item', item}));
  }

  // Start virtual rendering
  currentVirtualList = { rows, cat, catChecked, groupField, isAccordion, catObj };
  renderVirtual(area);
}

// ── VIRTUAL SCROLL ────────────────────────────────────────────────────────────
let currentVirtualList = null;
const BATCH_SIZE = 40; // items rendered per batch

function renderItemHtml(item, cat, catChecked, groupField, isAccordion) {
  const isChecked = !!catChecked[item.id];
  const ownedState = owned[cat]?.[item.id];
  const ownedClass = ownedState==='missing' ? ' missing' : ownedState==='owned' ? ' owned' : '';
  const ownedSymbol = ownedState==='missing' ? '✕' : ownedState==='owned' ? '✓' : '·';
  if (isAccordion) {
    const ingList = (ingredients[cat][item.id]||[]);
    const ingCount = ingList.length;
    return `<div class="list-item recipe-item${isChecked?' checked':''}" data-id="${item.id}">
      <div class="recipe-main">
        <span class="item-owned${ownedClass}" onclick="cycleOwned(${item.id})" title="Possession">${ownedSymbol}</span>
        <span class="item-label" onclick="toggleCheck(${item.id})">${esc(item.name)}</span>
        ${item.meta ? `<span class="item-meta">${esc(item.meta)}</span>` : ''}
        ${item.meta2 ? `<span class="item-meta2">${esc(item.meta2)}</span>` : ''}
        <button class="accordion-btn" onclick="toggleAccordion(this,${item.id})" title="Ingrédients">
          <span class="accordion-arrow">▶</span> ${ingCount ? ingCount+'ing.' : 'Ing.'}
        </button>
        <button class="item-edit" onclick="startEdit(${item.id})" title="Modifier">✎</button>
        <button class="item-delete" onclick="deleteItem(${item.id})" title="Supprimer">✕</button>
      </div>
      <div class="ingredient-panel" data-item-id="${item.id}">
        ${ingList.map((ing,idx) => `<div class="ingredient-row">
          <span class="ingredient-bullet">◆</span>
          <span class="ingredient-text">${esc(ing)}</span>
          <button class="ingredient-delete" onclick="deleteIngredient(${item.id},${idx})" title="Supprimer">✕</button>
        </div>`).join('')}
        <div class="ingredient-add-row">
          <input class="ingredient-input" type="text" placeholder="Ajouter un ingrédient..." id="ing-input-${item.id}"
            onkeydown="if(event.key==='Enter')addIngredient(${item.id})">
          <button class="ingredient-add-btn" onclick="addIngredient(${item.id})">+</button>
        </div>
      </div>
    </div>`;
  }
  const showMeta  = item.meta  && groupField !== 'meta';
  const showMeta2 = item.meta2 && groupField !== 'meta2';
  return `<div class="list-item${isChecked?' checked':''}" data-id="${item.id}">
    <span class="item-owned${ownedClass}" onclick="cycleOwned(${item.id})" title="Possession">${ownedSymbol}</span>
    <span class="item-label" onclick="toggleCheck(${item.id})">${esc(item.name)}</span>
    ${showMeta  ? `<span class="item-meta">${esc(item.meta)}</span>`   : ''}
    ${showMeta2 ? `<span class="item-meta2">${esc(item.meta2)}</span>` : ''}
    <button class="item-edit" onclick="startEdit(${item.id})" title="Modifier">✎</button>
    <button class="item-delete" onclick="deleteItem(${item.id})" title="Supprimer">✕</button>
  </div>`;
}

function renderVirtual(area) {
  const vl = currentVirtualList;
  if (!vl) return;
  const {rows, cat, catChecked, groupField, isAccordion, catObj} = vl;

  // Render first batch immediately
  const firstBatch = rows.slice(0, BATCH_SIZE);
  let html = firstBatch.map(row =>
    row.type === 'header'
      ? `<div class="group-header">${esc(row.key)}</div>`
      : renderItemHtml(row.item, cat, catChecked, groupField, isAccordion)
  ).join('');

  // Add sentinel div if more rows remain
  const remaining = rows.length - BATCH_SIZE;
  if (remaining > 0) {
    html += `<div id="load-more-sentinel" style="height:40px;display:flex;align-items:center;justify-content:center;color:var(--text3);font-size:12px">Chargement... (${remaining} restants)</div>`;
  }
  html += addRowHTML(catObj, isAccordion);

  area.innerHTML = html;
  bindAddRow(isAccordion);

  // If more rows, render rest in chunks using requestAnimationFrame
  if (remaining > 0) {
    vl.renderedCount = BATCH_SIZE;
    scheduleNextBatch(area, vl);
  }
}

function scheduleNextBatch(area, vl) {
  requestAnimationFrame(() => {
    if (currentVirtualList !== vl) return; // category changed, abort
    const {rows, cat, catChecked, groupField, isAccordion, catObj} = vl;
    const next = rows.slice(vl.renderedCount, vl.renderedCount + BATCH_SIZE);
    if (!next.length) return;

    const sentinel = document.getElementById('load-more-sentinel');
    if (!sentinel) return;

    const fragment = document.createDocumentFragment();
    next.forEach(row => {
      const div = document.createElement('div');
      div.innerHTML = row.type === 'header'
        ? `<div class="group-header">${esc(row.key)}</div>`
        : renderItemHtml(row.item, cat, catChecked, groupField, isAccordion);
      while (div.firstChild) fragment.appendChild(div.firstChild);
    });

    sentinel.before(fragment);
    vl.renderedCount += BATCH_SIZE;

    const remaining = rows.length - vl.renderedCount;
    if (remaining > 0) {
      sentinel.textContent = `Chargement... (${remaining} restants)`;
      scheduleNextBatch(area, vl);
    } else {
      sentinel.remove();
    }
  });
}


function addRowHTML(catObj, isAccordion) {
  const singular = catObj?.label.replace(/s$/,'').toLowerCase() || 'élément';
  return `<div class="add-row">
    <input type="text" id="add-name" placeholder="Ajouter ${singular}...">
    <input type="text" id="add-meta" class="add-meta-input" placeholder="Tag 1">
    <input type="text" id="add-meta2" class="add-meta2-input" placeholder="Tag 2">
    <button class="add-btn" id="add-btn-main">+ Ajouter</button>
  </div>`;
}

function bindAddRow(isAccordion) {
  const nameEl = document.getElementById('add-name');
  const metaEl = document.getElementById('add-meta');
  const meta2El = document.getElementById('add-meta2');
  const btn = document.getElementById('add-btn-main');
  if (!nameEl) return;
  const handler = (e) => { if (!e || e.type==='click' || e.key==='Enter') addItem(); };
  nameEl.addEventListener('keydown', handler);
  if (metaEl) metaEl.addEventListener('keydown', handler);
  if (meta2El) meta2El.addEventListener('keydown', handler);
  if (btn) btn.addEventListener('click', handler);
}

function toggleAccordion(btn, itemId) {
  btn.classList.toggle('open');
  const panel = document.querySelector(`.ingredient-panel[data-item-id="${itemId}"]`);
  if (panel) panel.classList.toggle('open');
}

function addIngredient(itemId) {
  const input = document.getElementById(`ing-input-${itemId}`);
  if (!input) return;
  const val = input.value.trim();
  if (!val) return;
  if (!ingredients[currentCat][itemId]) ingredients[currentCat][itemId] = [];
  ingredients[currentCat][itemId].push(val);
  saveData();
  // Re-render but keep accordion open
  const wasOpen = document.querySelector(`.ingredient-panel[data-item-id="${itemId}"]`)?.classList.contains('open');
  renderList();
  if (wasOpen) {
    const panel = document.querySelector(`.ingredient-panel[data-item-id="${itemId}"]`);
    const btn = panel?.previousElementSibling?.querySelector('.accordion-btn');
    if (panel) { panel.classList.add('open'); }
    if (btn) { btn.classList.add('open'); }
    // Focus back on input
    const newInput = document.getElementById(`ing-input-${itemId}`);
    if (newInput) newInput.focus();
  }
}

function deleteIngredient(itemId, idx) {
  if (ingredients[currentCat][itemId]) {
    ingredients[currentCat][itemId].splice(idx, 1);
    saveData();
    const wasOpen = document.querySelector(`.ingredient-panel[data-item-id="${itemId}"]`)?.classList.contains('open');
    renderList();
    if (wasOpen) {
      const panel = document.querySelector(`.ingredient-panel[data-item-id="${itemId}"]`);
      const btn = panel?.previousElementSibling?.querySelector('.accordion-btn');
      if (panel) panel.classList.add('open');
      if (btn) btn.classList.add('open');
    }
  }
}

function toggleCheck(id) {
  checked[currentCat][id] = !checked[currentCat][id];
  saveData(); renderNav(); renderList();
}

function cycleOwned(id) {
  const current = owned[currentCat][id] || 'neutral';
  // Cycle: neutral → owned → missing → neutral
  owned[currentCat][id] = current === 'neutral' ? 'owned' : current === 'owned' ? 'missing' : 'neutral';
  saveData(); renderList();
}

function addItem() {
  const nameEl = document.getElementById('add-name');
  const metaEl = document.getElementById('add-meta');
  const meta2El = document.getElementById('add-meta2');
  const name = nameEl?.value.trim();
  if (!name) return;
  const meta = metaEl?.value.trim()||'';
  const meta2 = meta2El?.value.trim()||'';
  const id = nextId[currentCat]++;
  data[currentCat].push({id, name, meta, meta2});
  sortCat(currentCat);
  saveData(); renderNav(); renderList();
  document.getElementById('add-name')?.focus();
}

function startEdit(id) {
  const item = data[currentCat].find(i => i.id === id);
  if (!item) return;
  const row = document.querySelector(`.list-item[data-id="${id}"]`);
  if (!row) return;

  // Determine if it's an accordion item (has .recipe-main)
  const isAccordion = row.classList.contains('recipe-item');
  const container = isAccordion ? row.querySelector('.recipe-main') : row;

  // Replace content with editable fields
  // Save original HTML to allow cancel
  container.dataset.origHtml = container.innerHTML;
  row.classList.add('editing');

  container.innerHTML = `
    <span class="item-owned${owned[currentCat]?.[id]==='missing'?' missing':owned[currentCat]?.[id]==='owned'?' owned':''}" onclick="cycleOwned(${id})" title="Possession" style="flex-shrink:0">${owned[currentCat]?.[id]==='missing'?'✕':owned[currentCat]?.[id]==='owned'?'✓':'·'}</span>
    <div class="item-edit-fields">
      <input class="item-edit-name" id="edit-name-${id}" type="text" value="${esc(item.name)}" placeholder="Nom">
      <input class="item-edit-meta" id="edit-meta-${id}" type="text" value="${esc(item.meta||'')}" placeholder="Tag 1">
      <input class="item-edit-meta2" id="edit-meta2-${id}" type="text" value="${esc(item.meta2||'')}" placeholder="Tag 2">
    </div>
    <button class="item-edit-confirm" onclick="confirmEdit(${id})" title="Valider">✔</button>
    <button class="item-delete" onclick="deleteItem(${id})" title="Supprimer" style="opacity:1">✕</button>
  `;

  const nameInput = document.getElementById(`edit-name-${id}`);
  nameInput.focus();
  nameInput.select();

  // Confirm on Enter
  [nameInput,
   document.getElementById(`edit-meta-${id}`),
   document.getElementById(`edit-meta2-${id}`)
  ].forEach(el => {
    if (el) el.addEventListener('keydown', e => {
      if (e.key === 'Enter') confirmEdit(id);
      if (e.key === 'Escape') { renderList(); }
    });
  });
}

function confirmEdit(id) {
  const nameVal = document.getElementById(`edit-name-${id}`)?.value.trim();
  if (!nameVal) return;
  const metaVal = document.getElementById(`edit-meta-${id}`)?.value.trim() || '';
  const meta2Val = document.getElementById(`edit-meta2-${id}`)?.value.trim() || '';
  const item = data[currentCat].find(i => i.id === id);
  if (!item) return;
  item.name = nameVal;
  item.meta = metaVal;
  item.meta2 = meta2Val;
  saveData(); renderNav(); renderList();
}

function deleteItem(id) {
  data[currentCat] = data[currentCat].filter(i=>i.id!==id);
  delete checked[currentCat][id];
  delete (ingredients[currentCat]||{})[id];
  delete (owned[currentCat]||{})[id];
  saveData(); renderNav(); renderList();
}

function switchCat(cat) {
  currentCat = cat; currentFilter = 'all';
  document.getElementById('search-input').value = '';
  document.querySelectorAll('.filter-btn').forEach(b=>b.classList.remove('active'));
  document.getElementById('filter-all').classList.add('active');
  closeSidebar();
  renderNav(); renderList();
}

function setFilter(f) {
  currentFilter = f;
  document.querySelectorAll('.filter-btn').forEach(b=>b.classList.remove('active'));
  document.getElementById('filter-'+f).classList.add('active');
  renderList();
}

function toggleSidebar() {
  document.getElementById('sidebar').classList.toggle('open');
  document.getElementById('overlay').classList.toggle('active');
}

function closeSidebar() {
  document.getElementById('sidebar').classList.remove('open');
  document.getElementById('overlay').classList.remove('active');
}


// ── GITHUB SAVE ──────────────────────────────────────────────────────────────
const GH_STORAGE_KEY = 'dlv_gh_config';

function openGhModal() {
  const cfg = JSON.parse(localStorage.getItem(GH_STORAGE_KEY)||'{}');
  document.getElementById('gh-user').value     = cfg.user     || '';
  document.getElementById('gh-repo').value     = cfg.repo     || '';
  document.getElementById('gh-filename').value = cfg.filename || 'index.html';
  document.getElementById('gh-token').value    = cfg.token    || '';
  document.getElementById('gh-status').textContent = '';
  document.getElementById('gh-status').className   = '';
  document.getElementById('gh-modal-overlay').classList.add('active');
}

function closeGhModal() {
  document.getElementById('gh-modal-overlay').classList.remove('active');
}

async function saveToGithub() {
  const user     = document.getElementById('gh-user').value.trim();
  const repo     = document.getElementById('gh-repo').value.trim();
  const filename = document.getElementById('gh-filename').value.trim() || 'index.html';
  const token    = document.getElementById('gh-token').value.trim();
  const statusEl = document.getElementById('gh-status');
  const btn      = document.getElementById('gh-save-btn');

  if (!user || !repo || !token) {
    statusEl.textContent = 'Remplis tous les champs.';
    statusEl.className = 'err';
    return;
  }

  // Save config (without token for security — user re-enters each session if they want)
  localStorage.setItem(GH_STORAGE_KEY, JSON.stringify({user, repo, filename, token}));

  btn.disabled = true;
  statusEl.textContent = 'Génération du fichier...';
  statusEl.className = '';

  try {
    // Build updated HTML with current data baked in
    const newHtml = generateUpdatedHtml();

    // Get current file SHA (required by GitHub API to update)
    statusEl.textContent = 'Connexion à GitHub...';
    const getResp = await fetch(
      `https://api.github.com/repos/${user}/${repo}/contents/${filename}`,
      { headers: { Authorization: `token ${token}`, Accept: 'application/vnd.github.v3+json' } }
    );
    if (!getResp.ok) throw new Error(`Erreur GitHub: ${getResp.status} — vérifie utilisateur/dépôt/token`);
    const fileData = await getResp.json();
    const sha = fileData.sha;

    // Push updated file
    statusEl.textContent = 'Envoi en cours...';
    const putResp = await fetch(
      `https://api.github.com/repos/${user}/${repo}/contents/${filename}`,
      {
        method: 'PUT',
        headers: { Authorization: `token ${token}`, 'Content-Type': 'application/json' },
        body: JSON.stringify({
          message: 'Sauvegarde DLV Guide — ' + new Date().toLocaleString('fr-FR'),
          content: btoa(unescape(encodeURIComponent(newHtml))),
          sha: sha
        })
      }
    );
    if (!putResp.ok) {
      const err = await putResp.json();
      throw new Error(err.message || `Erreur ${putResp.status}`);
    }

    statusEl.textContent = '✓ Sauvegardé ! Rechargement...';
    statusEl.className = 'ok';
    setTimeout(() => { closeGhModal(); location.reload(); }, 2000);

  } catch(e) {
    statusEl.textContent = e.message;
    statusEl.className = 'err';
    btn.disabled = false;
  }
}

function replaceBlock(html, marker, newValue) {
  const start = html.indexOf(marker);
  if (start === -1) return html;
  const eqIdx = html.indexOf('=', start);
  let depth = 0, i = eqIdx;
  while (i < html.length) {
    if (html[i] === '{') depth++;
    else if (html[i] === '}') { depth--; if (depth === 0) { i++; break; } }
    i++;
  }
  if (html[i] === ';') i++;
  return html.slice(0, start) + newValue + html.slice(i);
}

function generateUpdatedHtml(){
  return document.documentElement.outerHTML;
}

function buildDefaultDataJs() {
  const obj = {};
  CATEGORIES.forEach(c => { obj[c.id] = data[c.id]; });
  return JSON.stringify(obj);
}

function buildDataJson(){
  return JSON.stringify({
    data: Object.fromEntries(CATEGORIES.map(c=>[c.id,data[c.id]])),
    owned, checked, ingredients
  });
}

// Close modal on overlay click — deferred to init
function bindModalOverlay() {
  const el = document.getElementById('gh-modal-overlay');
  if (el) el.addEventListener('click', function(e) {
    if (e.target === this) closeGhModal();
  });
}

document.getElementById('search-input').addEventListener('input', renderList);

document.getElementById('list-area').addEventListener('scroll', function() {
  const btn = document.getElementById('scroll-top');
  if (this.scrollTop > 200) btn.classList.add('visible');
  else btn.classList.remove('visible');
});

bindModalOverlay();
(async function(){
  try{
    const r=await fetch('data.json');
    if(r.ok){const d=await r.json();DEFAULT_DATA=d.data||{};DEFAULT_OWNED=d.owned||{};DEFAULT_CHECKED=d.checked||{};DEFAULT_INGREDIENTS=d.ingredients||{};}
  }catch(e){console.warn('data.json',e);}
  loadData();renderNav();renderList();
  const ls=document.getElementById('loading-screen');
  if(ls)ls.style.display='none';
})();
</script>
